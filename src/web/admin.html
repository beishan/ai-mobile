<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>墨读 · 设备管理</title>
<style>
:root{--ink:#171713;--paper:#f2efe4;--paper2:#e8e2d2;--red:#b52b20;--muted:#716e64;--line:#bbb4a3;--ok:#2e6849}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font-family:"Songti SC","STSong","Noto Serif SC",serif;background-image:linear-gradient(rgba(25,25,20,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(25,25,20,.018) 1px,transparent 1px);background-size:5px 5px}button,input{font:inherit}header{padding:28px 20px 18px;border-bottom:3px double var(--ink);position:relative}header:after{content:"设备控制台 / LOCAL";position:absolute;right:20px;top:18px;font:10px ui-monospace,monospace;letter-spacing:.12em;color:var(--muted)}h1{font-size:30px;margin:8px 0 3px;letter-spacing:.12em}.sub{margin:0;color:var(--muted);font-size:13px}.status{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.tag{border:1px solid var(--ink);padding:4px 8px;font:11px ui-monospace,monospace}.tag.ok{color:var(--ok);border-color:var(--ok)}nav{display:grid;grid-template-columns:repeat(4,1fr);position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--ink)}nav button{border:0;border-right:1px solid var(--line);background:none;padding:13px 3px;color:var(--muted);font-weight:700}nav button.active{background:var(--ink);color:var(--paper)}main{max-width:720px;margin:auto;padding:18px 16px 70px}.panel{display:none;animation:in .22s ease}.panel.active{display:block}@keyframes in{from{opacity:0;transform:translateY(5px)}}.section-head{display:flex;align-items:end;justify-content:space-between;margin:10px 0 14px}.section-head h2{font-size:23px;margin:0}.num{font:44px/.8 Georgia,serif;color:var(--line)}.card{border:1px solid var(--ink);background:rgba(255,255,255,.18);padding:16px;margin:0 0 14px;box-shadow:4px 4px 0 var(--paper2)}label{display:block;font-size:12px;color:var(--muted);letter-spacing:.08em;margin:13px 0 6px}.field{width:100%;border:0;border-bottom:1px solid var(--ink);background:rgba(255,255,255,.25);padding:11px 8px;outline:none;border-radius:0}.field:focus{border-bottom:3px solid var(--red)}.btn{border:1px solid var(--ink);background:transparent;padding:11px 14px;font-weight:700;cursor:pointer}.btn.primary{background:var(--red);border-color:var(--red);color:white}.btn.small{padding:7px 10px;font-size:12px}.row{display:flex;gap:9px;align-items:center}.row>*{flex:1}.network{display:grid;grid-template-columns:1fr auto;gap:4px;padding:12px 4px;border-bottom:1px dotted var(--line);cursor:pointer}.network:hover{background:var(--paper2)}.network small{color:var(--muted)}.signal{font:12px ui-monospace,monospace}.files{margin-top:12px}.file{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:9px;padding:12px 0;border-bottom:1px dotted var(--line)}.file-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.size{color:var(--muted);font:11px ui-monospace,monospace}.drop{position:relative;border:1px dashed var(--ink);padding:25px 12px;text-align:center;background:var(--paper2)}.drop input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}.progress{height:5px;background:var(--line);margin-top:10px;display:none}.progress i{display:block;height:100%;width:0;background:var(--red)}.notice{padding:11px 12px;border-left:4px solid var(--red);background:var(--paper2);font-size:13px;margin-bottom:14px}.empty{color:var(--muted);padding:22px 0;text-align:center}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--paper);padding:11px 18px;z-index:20;transition:.2s;max-width:90%;text-align:center}.toast.show{opacity:1;transform:translateX(-50%)}code{font-family:ui-monospace,monospace;font-size:12px}@media(min-width:650px){header{padding-left:calc((100% - 680px)/2)}nav{padding:0 calc((100% - 720px)/2)}.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}}
select.field{font-family:"Songti SC","STSong","Noto Serif SC",serif;color:var(--ink);appearance:auto}select.field option,select.field optgroup{font-family:sans-serif;background:var(--paper);color:var(--ink)}
</style>
</head>
<body>
<header><h1>墨读</h1><p class="sub">ESP32 电子纸阅读器管理后台</p><div class="status"><span class="tag" id="mode">连接中</span><span class="tag" id="sd">SD 检测中</span></div></header>
<nav><button class="active" data-tab="wifi">网络</button><button data-tab="weather">天气</button><button data-tab="books">书籍</button><button data-tab="fonts">字体</button></nav>
<main>
<section class="panel active" id="wifi"><div class="section-head"><h2>无线网络</h2><span class="num">01</span></div><div class="notice" id="provision">选择家庭 Wi-Fi 并输入密码。保存后阅读器将重启并加入该网络。</div><div class="card"><div class="row"><strong>附近网络</strong><button class="btn small" onclick="scanWifi()">重新扫描</button></div><div id="networks"><div class="empty">正在扫描…</div></div><form id="wifiForm"><label>SSID</label><input class="field" id="ssid" name="ssid" maxlength="32" required><label>密码</label><input class="field" id="wifiPassword" name="password" type="password" maxlength="64" placeholder="开放网络可留空"><div style="height:16px"></div><button class="btn primary" type="submit">保存并连接</button></form></div></section>
<section class="panel" id="weather"><div class="section-head"><h2>和风天气</h2><span class="num">02</span></div><div class="card"><form id="weatherForm"><label>个人 API Host</label><input class="field" id="weatherHost" name="host" placeholder="例如 abc123.def.qweatherapi.com" required><label>天气城市</label><select class="field" id="weatherLocation" name="location" required><option value="" disabled>请选择城市</option><optgroup label="直辖市"><option value="101010100">北京</option><option value="101020100">上海</option><option value="101030100">天津</option><option value="101040100">重庆</option></optgroup><optgroup label="华东地区"><option value="101190101">南京</option><option value="101210101">杭州</option><option value="101190401">苏州</option><option value="101220101">合肥</option><option value="101230101">福州</option><option value="101230201">厦门</option><option value="101240101">南昌</option><option value="101120101">济南</option><option value="101120201">青岛</option></optgroup><optgroup label="华南地区"><option value="101280101">广州</option><option value="101280601">深圳</option><option value="101300101">南宁</option><option value="101310101">海口</option></optgroup><optgroup label="华中地区"><option value="101200101">武汉</option><option value="101250101">长沙</option><option value="101180101">郑州</option></optgroup><optgroup label="西南地区"><option value="101270101">成都</option><option value="101290101">昆明</option><option value="101260101">贵阳</option><option value="101140101">拉萨</option></optgroup><optgroup label="西北地区"><option value="101110101">西安</option><option value="101160101">兰州</option><option value="101150101">西宁</option><option value="101170101">银川</option><option value="101130101">乌鲁木齐</option></optgroup><optgroup label="东北地区"><option value="101070101">沈阳</option><option value="101070201">大连</option><option value="101060101">长春</option><option value="101050101">哈尔滨</option></optgroup><optgroup label="华北地区"><option value="101090101">石家庄</option><option value="101100101">太原</option><option value="101080101">呼和浩特</option></optgroup></select><p class="sub">选择中文城市后，系统会自动保存对应的和风天气 Location ID。</p><label>API Key</label><input class="field" id="weatherKey" name="api_key" type="password" placeholder="已配置时留空可保持原 Key"><p class="sub" id="keyState"></p><div style="height:16px"></div><button class="btn primary" type="submit">保存天气配置</button></form></div></section>
<section class="panel" id="books"><div class="section-head"><h2>书籍管理</h2><span class="num">03</span></div><div class="card"><div class="drop">点击选择 TXT / EPUB，或拖放到这里<input type="file" accept=".txt,.epub,text/plain,application/epub+zip" onchange="uploadFile('books',this)"></div><div class="progress" id="booksProgress"><i></i></div><div class="files" id="booksFiles"><div class="empty">读取中…</div></div></div></section>
<section class="panel" id="fonts"><div class="section-head"><h2>字体管理</h2><span class="num">04</span></div><div class="notice">字体文件必须为阅读器支持的 <code>.bin</code> 点阵格式。上传或删除后建议重启设备。</div><div class="card"><div class="drop">点击选择 BIN 字体，或拖放到这里<input type="file" accept=".bin,application/octet-stream" onchange="uploadFile('fonts',this)"></div><div class="progress" id="fontsProgress"><i></i></div><div class="files" id="fontsFiles"><div class="empty">读取中…</div></div></div></section>
</main><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);let statusData={};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2600)}
async function api(url,opt){const r=await fetch(url,opt);if(!r.ok)throw new Error(await r.text()||r.statusText);return r.json()}
$$('nav button').forEach(b=>b.onclick=()=>{$$('nav button').forEach(x=>x.classList.toggle('active',x===b));$$('.panel').forEach(x=>x.classList.toggle('active',x.id===b.dataset.tab));if(b.dataset.tab==='books'||b.dataset.tab==='fonts')loadFiles(b.dataset.tab)});
function selectWeatherLocation(value){const select=$('#weatherLocation');value=value||'';if(value&&![...select.options].some(option=>option.value===value)){const option=document.createElement('option');option.value=value;option.textContent='当前配置（'+value+'）';select.prepend(option)}select.value=value}
async function loadStatus(){try{statusData=await api('/api/status');$('#mode').textContent=statusData.mode==='provisioning'?'配网热点 · '+statusData.ap_ssid:'局域网管理';$('#mode').classList.add('ok');$('#sd').textContent=statusData.sd_mounted?'SD 卡已挂载':'未发现 SD 卡';$('#sd').classList.toggle('ok',statusData.sd_mounted);$('#ssid').value=statusData.wifi_ssid||'';$('#weatherHost').value=statusData.weather_host||'';selectWeatherLocation(statusData.weather_location);$('#keyState').textContent=statusData.weather_key_configured?'API Key 已保存；留空不会覆盖。':'尚未配置 API Key。';if(statusData.mode!=='provisioning')$('#provision').textContent='可在局域网中修改 Wi-Fi。保存后设备将重启并连接新网络。'}catch(e){toast('无法读取设备状态')}}
async function scanWifi(){const box=$('#networks');box.innerHTML='<div class="empty">正在扫描附近网络…</div>';try{const list=await api('/api/wifi/scan');box.innerHTML=list.length?'':'<div class="empty">未发现网络</div>';list.forEach(n=>{const e=document.createElement('div');e.className='network';e.innerHTML='<div><strong></strong><br><small>'+(n.secure?'需要密码':'开放网络')+'</small></div><span class="signal">'+n.rssi+' dBm</span>';e.querySelector('strong').textContent=n.ssid;e.onclick=()=>{$('#ssid').value=n.ssid;$('#wifiPassword').focus()};box.appendChild(e)})}catch(e){box.innerHTML='<div class="empty">扫描失败，请重试</div>'}}
$('#wifiForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/wifi',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(new FormData(e.target))});toast('已保存，设备正在重启…')}catch(x){toast('连接已断开；设备可能正在重启')}};
$('#weatherForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/weather',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(new FormData(e.target))});$('#weatherKey').value='';$('#keyState').textContent='API Key 已保存；留空不会覆盖。';toast('天气配置已保存')}catch(x){toast('保存失败：'+x.message)}};
function formatSize(n){if(n<1024)return n+' B';if(n<1048576)return(n/1024).toFixed(1)+' KB';return(n/1048576).toFixed(1)+' MB'}
async function loadFiles(type){const box=$('#'+type+'Files');box.innerHTML='<div class="empty">读取中…</div>';try{const list=await api('/api/files?type='+type);box.innerHTML=list.length?'':'<div class="empty">目录为空</div>';list.forEach(f=>{const e=document.createElement('div');e.className='file';const n=document.createElement('span');n.className='file-name';n.textContent=f.name;const s=document.createElement('span');s.className='size';s.textContent=formatSize(f.size);const b=document.createElement('button');b.className='btn small';b.textContent='删除';b.onclick=()=>deleteFile(type,f.name);e.append(n,s,b);box.appendChild(e)})}catch(e){box.innerHTML='<div class="empty">无法读取文件，请检查 SD 卡</div>'}}
function uploadFile(type,input){const file=input.files[0];if(!file)return;const lower=file.name.toLowerCase(),valid=type==='books'?(lower.endsWith('.txt')||lower.endsWith('.epub')):lower.endsWith('.bin');if(!valid){toast(type==='books'?'请选择 TXT 或 EPUB 文件':'请选择 .bin 文件');return}const name=new TextEncoder().encode(file.name);if(name.length>240){toast('文件名过长，请缩短后重试');return}const head=new Uint8Array([name.length&255,name.length>>8]),body=new Blob([head,name,file]),bar=$('#'+type+'Progress'),fill=bar.querySelector('i'),xhr=new XMLHttpRequest();bar.style.display='block';fill.style.width='0';xhr.upload.onprogress=e=>{if(e.lengthComputable)fill.style.width=(e.loaded/e.total*100)+'%'};xhr.onload=()=>{bar.style.display='none';input.value='';if(xhr.status<300){toast(type==='books'?'上传完成，书架正在刷新':'上传完成');loadFiles(type)}else toast('上传失败：'+xhr.responseText)};xhr.onerror=()=>{bar.style.display='none';toast('上传连接失败')};xhr.open('POST','/api/upload?type='+type);xhr.send(body)}
async function deleteFile(type,name){if(!confirm('确定删除“'+name+'”吗？'))return;try{await api('/api/files?type='+type+'&name='+encodeURIComponent(name),{method:'DELETE'});toast('已删除，重启后生效');loadFiles(type)}catch(e){toast('删除失败：'+e.message)}}
loadStatus();scanWifi();
</script></body></html>
