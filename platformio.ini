[platformio]
default_envs = esp32-n16r8

[env:esp32-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

board_build.flash_size = 16MB
board_build.memory_type = qio_opi
; ESP32-S3-WROOM-1 N16R8 uses Quad Flash and Octal PSRAM.
; DIO/40MHz avoids ROM-loader watchdog resets seen with QIO/80MHz.
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.partitions = partitions_16mb.csv
board_upload.flash_size = 16MB

build_flags =
    -DBOARD_HAS_PSRAM

[env:esp32-n16r8-hink-e037a03-a1]
extends = env:esp32-n16r8
build_flags =
    ${env:esp32-n16r8.build_flags}
    -DEPD_PANEL_MODEL=EPD_PANEL_HINK_E037A03_A1
